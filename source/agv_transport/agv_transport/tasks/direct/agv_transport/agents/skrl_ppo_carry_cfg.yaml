seed: 42

models:
  separate: False
  policy:
    class: GaussianMixin
    clip_actions: False
    clip_log_std: True
    min_log_std: -20.0
    max_log_std: 2.0
    initial_log_std: -1.2
    network:
      - name: net
        input: OBSERVATIONS
        layers: [128, 128]
        activations: elu
    output: ACTIONS
  value:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: OBSERVATIONS
        layers: [128, 128]
        activations: elu
    output: ONE

memory:
  class: RandomMemory
  memory_size: -1

agent:
  class: PPO
  # rollouts 32→64：更多 on-policy 数据，梯度估计更稳定
  rollouts: 64
  # epochs 8→5：减少过拟合，mini_batches 8→16：更稳定更新
  learning_epochs: 5
  mini_batches: 16
  discount_factor: 0.99
  lambda: 0.95
  # LR 3e-5→1.5e-4：原来太保守，PPO 几乎不学习，基线行为随训练退化
  learning_rate: 1.5e-04
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.008
  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  clip_predicted_values: True
  # entropy 0.0005→0.01：原来几乎零探索，PPO 破坏基线后无法恢复
  entropy_loss_scale: 0.01
  value_loss_scale: 2.0
  kl_threshold: 0.0
  rewards_shaper_scale: 0.1
  # time_limit_bootstrap：超时 episode 用价值函数 bootstrap，
  # 避免把"超时"当作"失败"，改善价值函数精度
  time_limit_bootstrap: True

  # Isaac Lab's scripts/skrl/train.py reads the experiment settings from
  # agent_cfg["agent"]["experiment"]. Keep this block nested under agent.
  experiment:
    directory: "agv_carry_direct"
    experiment_name: "v6_0_b10_sync_drive_heading_relax"
    write_interval: auto
    checkpoint_interval: auto

trainer:
  class: SequentialTrainer
  timesteps: 150000

environment_info: log
